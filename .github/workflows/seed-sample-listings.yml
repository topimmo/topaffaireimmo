import "dotenv/config";
import { createClient } from "@supabase/supabase-js";

type Env = {
  SUPABASE_URL?: string;
  SUPABASE_SERVICE_ROLE_KEY?: string;
  PEXELS_API_KEY?: string;
  FORCE_SEED?: string;
  LISTINGS_COUNT?: string;
  ADMIN_EMAIL?: string;
};

function requireEnv(name: keyof Env, env: Env): string {
  const v = env[name];
  if (!v || !String(v).trim()) throw new Error(`Missing env var: ${String(name)}`);
  return String(v).trim();
}

function toInt(v: string | undefined, def: number) {
  const n = Number(v);
  return Number.isFinite(n) && n > 0 ? Math.floor(n) : def;
}

function maskUrl(url: string) {
  try {
    const u = new URL(url);
    return `${u.protocol}//${u.host}/***`;
  } catch {
    return "***";
  }
}

// ✅ fallback images if PEXELS_API_KEY not provided
const FALLBACK_IMAGES = [
  "https://images.unsplash.com/photo-1560185008-a33f5ff1cb8f?auto=format&fit=crop&w=1600&q=80",
  "https://images.unsplash.com/photo-1501183638710-841dd1904471?auto=format&fit=crop&w=1600&q=80",
  "https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=1600&q=80",
];

function pick<T>(arr: T[], i: number) {
  return arr[i % arr.length];
}

function nowIso() {
  return new Date().toISOString();
}

async function main() {
  const env = process.env as Env;

  const SUPABASE_URL = requireEnv("SUPABASE_URL", env);
  const SUPABASE_SERVICE_ROLE_KEY = requireEnv("SUPABASE_SERVICE_ROLE_KEY", env);

  const ADMIN_EMAIL = (env.ADMIN_EMAIL || "contact@topaffaireimmo.com").trim();
  const FORCE_SEED = String(env.FORCE_SEED || "false").toLowerCase() === "true";
  const LISTINGS_COUNT = toInt(env.LISTINGS_COUNT, 50);
  const PEXELS_API_KEY = (env.PEXELS_API_KEY || "").trim();

  console.log("🌱 Starting Sample Listings Seed Script");
  console.log("Configuration:");
  console.log(`- Target listings: ${LISTINGS_COUNT}`);
  console.log(`- FORCE_SEED: ${FORCE_SEED}`);
  console.log(`- Supabase URL: ${maskUrl(SUPABASE_URL)}`);
  console.log(`- Using service role key: ✅`);
  console.log(`- Pexels API: ${PEXELS_API_KEY ? "✅" : "❌ (using fallbacks)"}`);
  console.log(`- Admin email: ${ADMIN_EMAIL}`);

  const supabase = createClient(SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, {
    auth: { persistSession: false, autoRefreshToken: false },
    db: { schema: "public" },
  });

  // 1) ✅ Get admin profile by email (NO more system user creation)
  const { data: adminProfile, error: adminErr } = await supabase
    .from("profiles")
    .select("id,email,is_admin")
    .eq("email", ADMIN_EMAIL)
    .maybeSingle();

  if (adminErr) throw new Error(`Failed to fetch admin profile: ${adminErr.message}`);

  if (!adminProfile?.id) {
    throw new Error(
      `Admin profile not found in public.profiles for email="${ADMIN_EMAIL}".\n` +
        `➡️ Create it by signing up with that email, then set is_admin=true.`
    );
  }

  if (!adminProfile.is_admin) {
    console.warn(
      `⚠️ Admin profile found but is_admin=false for ${ADMIN_EMAIL}.\n` +
        `Seed will still insert using service role, but it's better to set is_admin=true.`
    );
  }

  const owner_id = adminProfile.id;

  // 2) Check existing sample data
  const { count: existingCount, error: countErr } = await supabase
    .from("properties")
    .select("*", { count: "exact", head: true })
    .eq("is_sample", true);

  if (countErr) throw new Error(`Failed to count existing sample listings: ${countErr.message}`);

  console.log(`📦 Existing sample listings: ${existingCount ?? 0}`);

  if ((existingCount ?? 0) > 0 && !FORCE_SEED) {
    console.log("✅ Sample listings already exist. Set FORCE_SEED=true to re-seed.");
    return;
  }

  if ((existingCount ?? 0) > 0 && FORCE_SEED) {
    console.log("🧹 FORCE_SEED enabled — deleting existing sample listings...");
    const { error: delErr } = await supabase.from("properties").delete().eq("is_sample", true);
    if (delErr) throw new Error(`Failed to delete existing sample listings: ${delErr.message}`);
  }

  // 3) Build listings payload
  const listings = Array.from({ length: LISTINGS_COUNT }).map((_, i) => {
    const price = 450000 + i * 25000;
    const surface = 60 + (i % 6) * 10;
    const rooms = 2 + (i % 5);

    const img = PEXELS_API_KEY ? pick(FALLBACK_IMAGES, i) : pick(FALLBACK_IMAGES, i); // keep fallback for now

    return {
      owner_id,
      status: "published",
      is_sample: true,
      title: `Sample Property #${i + 1}`,
      description: `This is a seeded sample listing generated at ${nowIso()}.`,
      city: "Casablanca",
      address: `Sample Street ${i + 1}`,
      price,
      surface,
      rooms,
      images: [img],
      created_at: nowIso(),
      updated_at: nowIso(),
    };
  });

  // 4) Insert
  console.log(`🚀 Inserting ${listings.length} sample listings into public.properties...`);

  const { error: insErr } = await supabase.from("properties").insert(listings);

  if (insErr) throw new Error(`Insert failed: ${insErr.message}`);

  // 5) Post-insert verification
  const { count: afterCount, error: afterErr } = await supabase
    .from("properties")
    .select("*", { count: "exact", head: true })
    .eq("is_sample", true);

  if (afterErr) throw new Error(`Post-insert count failed: ${afterErr.message}`);

  console.log(`✅ Done. Sample listings now in DB: ${afterCount ?? 0}`);
  if ((afterCount ?? 0) === 0) {
    throw new Error("Insert reported success but count is still 0. Check RLS/policies or schema mismatch.");
  }

  console.log("🎉 Sample listings seeded successfully!");
}

main().catch((e) => {
  console.error("❌ Seed failed:", e?.message || e);
  process.exit(1);
});
