name: Seed Sample Listings

on:
  workflow_dispatch:
    inputs:
      listings_count:
        description: "How many listings to seed?"
        required: false
        default: "50"

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run seed script
        env:
          # ✅ secrets
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

          # ✅ seed options
          FORCE_SEED: "true"
          LISTINGS_COUNT: ${{ inputs.listings_count }}
          ADMIN_EMAIL: "contact@topaffaireimmo.com"
        run: npm run seed:sample-listings

      - name: Done
        run: echo "✅ Sample listings seeded successfully"
