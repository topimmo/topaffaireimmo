name: Seed Sample Listings

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Preflight - validate secrets
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -e
          echo "✅ Checking required environment variables..."
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "❌ Missing SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          fi

          # Prefer SUPABASE_URL, fallback to VITE_SUPABASE_URL
          FINAL_URL="${SUPABASE_URL:-$VITE_SUPABASE_URL}"
          if [ -z "$FINAL_URL" ]; then
            echo "❌ Missing SUPABASE URL (set SUPABASE_URL or VITE_SUPABASE_URL)"
            exit 1
          fi

          echo "✅ SUPABASE_URL is set (preview): $(echo "$FINAL_URL" | cut -c1-30)..."
          if [ -n "$PEXELS_API_KEY" ]; then
            echo "✅ PEXELS_API_KEY is set"
          else
            echo "ℹ️ PEXELS_API_KEY not set (will use placeholders)"
          fi

      - name: Run seed script
        env:
          # Provide both names for compatibility
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FORCE_SEED: "true"
        run: npm run seed:sample-listings

      - name: Done
        run: echo "✅ Sample listings seeded successfully"
