name: Seed Sample Listings

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Validate environment variables
        run: |
          echo "Validating required environment variables..."
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "❌ ERROR: VITE_SUPABASE_URL secret is not set"
            exit 1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "❌ ERROR: SUPABASE_SERVICE_ROLE_KEY secret is not set"
            exit 1
          fi
          echo "✅ All required environment variables are set"
          echo "   - VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:0:30}..."
          echo "   - SUPABASE_SERVICE_ROLE_KEY: ✓ (hidden)"
          echo "   - PEXELS_API_KEY: ${PEXELS_API_KEY:+✓ (set)}${PEXELS_API_KEY:-✗ (not set, will use placeholders)}"
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      - name: Run seed script
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FORCE_SEED: true
        run: npm run seed:sample-listings

      - name: Done
        run: echo "✅ Sample listings seeded successfully"
