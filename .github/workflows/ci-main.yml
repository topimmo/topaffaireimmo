name: CI - Main Branch

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type checking
        run: npm run typecheck || echo "⚠️ TypeScript errors detected (non-blocking)"
        continue-on-error: true

      - name: Verify PR #86 Enforcement (CRITICAL - MUST pass)
        run: npx tsx src/tests/ad-positioning.test.ts

      - name: Run build (MUST succeed)
        run: npm run build
        env:
          # Set minimal required env vars for build
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-key' }}
          VITE_PRODUCTION_DOMAIN: ${{ secrets.VITE_PRODUCTION_DOMAIN || 'https://topaffaireimmo.co' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
