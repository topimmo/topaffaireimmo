name: Supabase Apply Fixes

on:
  workflow_dispatch:
    inputs:
      action:
        description: "شنو بغيتي يدير؟"
        required: true
        default: "db_push"
        type: choice
        options:
          - db_push
          - run_sql_fixes
          - deploy_functions

jobs:
  supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ما كنستعملوش npm install -g supabase نهائياً
      # كنستعملو npx supabase@latest باش ما يوقعش نفس الخطأ ديال global install

      - name: Supabase login
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase@latest login --token "$SUPABASE_ACCESS_TOKEN"

      - name: Link Supabase project
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npx supabase@latest link --project-ref "$SUPABASE_PROJECT_REF"

      - name: DB Push (migrations)
        if: ${{ github.event.inputs.action == 'db_push' }}
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase@latest db push

      - name: Run SQL fixes (from supabase/fixes)
        if: ${{ github.event.inputs.action == 'run_sql_fixes' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

          for f in supabase/fixes/*.sql; do
            echo "Running $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Deploy Edge Functions
        if: ${{ github.event.inputs.action == 'deploy_functions' }}
        run: |
          npx supabase@latest functions deploy send-facebook-webhook
