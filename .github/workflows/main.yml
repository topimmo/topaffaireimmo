name: Supabase Apply Fixes

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose what to run"
        required: true
        default: "db_push"
        type: choice
        options:
          - db_push
          - run_sql_fixes
          - deploy_functions

jobs:
  supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: |
          curl -fsSL https://supabase.com/install.sh | sh
          echo "$HOME/.supabase/bin" >> $GITHUB_PATH

      - name: Login Supabase CLI
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase login --token "$SUPABASE_ACCESS_TOKEN"

      - name: Link project
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: DB Push (migrations)
        if: ${{ github.event.inputs.action == 'db_push' }}
        run: supabase db push

      - name: Run SQL fixes (from supabase/fixes)
        if: ${{ github.event.inputs.action == 'run_sql_fixes' }}
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

          DB_HOST="db.${SUPABASE_PROJECT_REF}.supabase.co"
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"

          for f in supabase/fixes/*.sql; do
            echo "Running $f"
            psql -h "$DB_HOST" -U "postgres" -d "postgres" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Deploy Edge Functions
        if: ${{ github.event.inputs.action == 'deploy_functions' }}
        run: |
          supabase functions deploy send-facebook-webhook
